<!DOCTYPE html>
<html lang="sw">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RAMKEY AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Poppins',sans-serif;

    background:
    linear-gradient(
        135deg,
        #020617,
        #0f172a,
        #111827
    );

    height:100vh;

    overflow:hidden;

    color:white;
}

.main{

    display:flex;

    flex-direction:column;

    height:100vh;
}

/* =========================
HEADER
========================= */

.header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:20px;

    background:rgba(15,23,42,0.7);

    backdrop-filter:blur(15px);

    border-bottom:1px solid rgba(255,255,255,0.08);
}

.logo{

    display:flex;

    align-items:center;

    gap:15px;
}

.logo-circle{

    width:55px;

    height:55px;

    border-radius:50%;

    background:
    linear-gradient(
        135deg,
        #10b981,
        #06b6d4
    );

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:24px;

    font-weight:bold;

    box-shadow:0 0 25px rgba(16,185,129,0.5);
}

.logo-text h1{

    font-size:24px;
}

.logo-text p{

    font-size:13px;

    opacity:0.7;
}

/* =========================
CHAT AREA
========================= */

.chat-container{

    flex:1;

    overflow-y:auto;

    padding:30px 15px 120px;

    scroll-behavior:smooth;
}

.chat-wrapper{

    max-width:950px;

    margin:auto;
}

/* =========================
MESSAGES
========================= */

.message{

    max-width:80%;

    padding:18px 20px;

    margin-bottom:18px;

    border-radius:22px;

    line-height:1.8;

    animation:fadeIn .3s ease;
}

.user{

    margin-left:auto;

    background:
    linear-gradient(
        135deg,
        #2563eb,
        #1d4ed8
    );

    border-bottom-right-radius:5px;

    box-shadow:
    0 10px 30px rgba(37,99,235,0.25);
}

.bot{

    background:
    rgba(30,41,59,0.9);

    border:1px solid rgba(255,255,255,0.05);

    border-bottom-left-radius:5px;

    backdrop-filter:blur(10px);

    box-shadow:
    0 10px 30px rgba(0,0,0,0.25);
}

.typing{

    opacity:0.7;

    font-style:italic;
}

/* =========================
INPUT AREA
========================= */

.input-area{

    position:fixed;

    bottom:0;

    width:100%;

    padding:20px;

    background:
    linear-gradient(
        to top,
        rgba(2,6,23,1),
        rgba(2,6,23,0.7)
    );

    backdrop-filter:blur(12px);
}

.input-wrapper{

    max-width:950px;

    margin:auto;

    display:flex;

    align-items:center;

    gap:15px;
}

.input-box{

    flex:1;

    display:flex;

    align-items:center;

    background:
    rgba(30,41,59,0.9);

    border:1px solid rgba(255,255,255,0.05);

    border-radius:20px;

    padding:10px 15px;
}

.input-box input{

    flex:1;

    background:none;

    border:none;

    outline:none;

    color:white;

    font-size:16px;

    padding:10px;
}

.input-box input::placeholder{

    color:#94a3b8;
}

.send-btn{

    width:60px;

    height:60px;

    border:none;

    border-radius:18px;

    cursor:pointer;

    background:
    linear-gradient(
        135deg,
        #10b981,
        #06b6d4
    );

    color:white;

    font-size:20px;

    transition:.3s;

    box-shadow:
    0 10px 25px rgba(16,185,129,0.4);
}

.send-btn:hover{

    transform:scale(1.05);
}

/* =========================
WELCOME
========================= */

.welcome{

    text-align:center;

    margin-top:100px;

    opacity:0.9;
}

.welcome h2{

    font-size:45px;

    margin-bottom:15px;

    background:
    linear-gradient(
        135deg,
        #10b981,
        #06b6d4
    );

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;
}

.welcome p{

    color:#cbd5e1;

    font-size:18px;
}

/* =========================
SCROLLBAR
========================= */

::-webkit-scrollbar{

    width:8px;
}

::-webkit-scrollbar-thumb{

    background:#1e293b;

    border-radius:20px;
}

/* =========================
ANIMATION
========================= */

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* =========================
MOBILE
========================= */

@media(max-width:768px){

    .welcome h2{
        font-size:32px;
    }

    .message{
        max-width:92%;
    }

    .send-btn{

        width:55px;
        height:55px;
    }
}


/* =========================
LOADING ANIMATION
========================= */

.loader{

    display:flex;

    align-items:center;

    gap:8px;

    padding:5px;
}

.loader span{

    width:12px;

    height:12px;

    border-radius:50%;

    background:#10b981;

    animation:bounce 0.6s infinite alternate;
}

.loader span:nth-child(2){

    animation-delay:0.2s;
}

.loader span:nth-child(3){

    animation-delay:0.4s;
}

@keyframes bounce{

    from{
        transform:translateY(0px);
        opacity:0.5;
    }

    to{
        transform:translateY(-10px);
        opacity:1;
    }
}



</style>

</head>

<body>

<div class="main">

    <!-- HEADER -->

    <div class="header">

        <div class="logo">

            <div class="logo-circle">
                ☪
            </div>

            <div class="logo-text">
                <h1>RAMKEY AI</h1>
                <p>Islamic AI Assistant</p>
            </div>

        </div>

    </div>

    <!-- CHAT -->

    <div class="chat-container" id="chat-container">

        <div class="chat-wrapper">

            <div class="welcome" id="welcome">

                <h2>Assalamu Alaykum 👋</h2>

                <p>
                    Uliza swali lolote kuhusu Uislamu,
                    dua,
                    Qur'an,
                    Hadith,
                    au elimu nyingine.
                </p>

            </div>

        </div>

    </div>

    <!-- INPUT -->

    <div class="input-area">

        <div class="input-wrapper">

            <div class="input-box">

                <input
                type="text"
                id="message"
                placeholder="Andika ujumbe wako...">

            </div>

            <button
            class="send-btn"
            onclick="sendMessage()">

                ➤

            </button>

        </div>

    </div>

</div>

<script>

let session_id =
localStorage.getItem("session_id");

async function sendMessage(){

    let input =
    document.getElementById("message");

    let message =
    input.value.trim();

    if(!message) return;

    hideWelcome();

    addMessage(message,"user");

    input.value="";

    let typingDiv = addTyping();

    let response = await fetch("/chat",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            message:message,
            session_id:session_id
        })
    });

    let data =
    await response.json();

    typingDiv.remove();

    session_id =
    data.session_id;

    localStorage.setItem(
        "session_id",
        session_id
    );

    typeMessage(
        data.response,
        "bot"
    );
}

function addMessage(text,type){

    let container =
    document.querySelector(
        ".chat-wrapper"
    );

    let div =
    document.createElement("div");

    div.className =
    `message ${type}`;

    div.innerHTML = text;

    container.appendChild(div);

    scrollBottom();
}

function addTyping(){

    let container =
    document.querySelector(
        ".chat-wrapper"
    );

    let div =
    document.createElement("div");

    div.className =
    "message bot typing";

    div.innerHTML = `

    <div class="loader">

        <span></span>
        <span></span>
        <span></span>

    </div>

    `;

    container.appendChild(div);

    scrollBottom();

    return div;
}

    
function typeMessage(text,type){

    let container =
    document.querySelector(
        ".chat-wrapper"
    );

    let div =
    document.createElement("div");

    div.className =
    `message ${type}`;

    container.appendChild(div);

    let i = 0;

    let speed = 8;

    let interval =
    setInterval(()=>{

        div.innerHTML =
        text.slice(0,i);

        i++;

        scrollBottom();

        if(i > text.length){

            clearInterval(interval);
        }

    },speed);
}

function scrollBottom(){

    let chat =
    document.getElementById(
        "chat-container"
    );

    chat.scrollTop =
    chat.scrollHeight;
}

function hideWelcome(){

    let welcome =
    document.getElementById(
        "welcome"
    );

    if(welcome){

        welcome.style.display="none";
    }
}

document
.getElementById("message")
.addEventListener(
    "keypress",
    function(e){

        if(e.key==="Enter"){

            sendMessage();
        }
    }
);

</script>

</body>
</html>
